<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RideTogether - Application pour organiser et participer à des balades moto">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RideTogether">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  
  <!-- Google Sign In Client ID (Web) -->
  <meta name="google-signin-client_id" content="481162301788-2j9lpcm9s7pkskh9uftkjikg0enavo23.apps.googleusercontent.com">
  <!-- Google Platform.js pour le support OAuth complet -->
  <script src="https://apis.google.com/js/platform.js" async defer></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>
  <link rel="shortcut icon" href="icons/Icon-192.png"/>

  <title>RideTogether</title>
  <link rel="manifest" href="manifest.json">

</head>
<body>
  <!-- Désactiver le service worker pour éviter les problèmes de cache -->
  <script>
    // Désactiver tous les service workers existants au chargement
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(function(success) {
              if (success) {
                console.log('Service worker désactivé');
              }
            });
          }
        });
      });
    }
  </script>
  <!-- This script loads the Flutter bootstrap code and initializes the app -->
  <script src="flutter_bootstrap.js" type="application/javascript"></script>
  <!-- Google Maps API - Chargé après Flutter pour éviter les conflits -->
  <!-- 
    ⚠️ IMPORTANT : Pour le développement, remplacez GOOGLE_MAPS_API_KEY_PLACEHOLDER par votre clé API
    Ou utilisez le script: scripts/run_web_dev.sh (ou .ps1/.bat) qui le fait automatiquement
    ⚠️ NE COMMITEZ JAMAIS CE FICHIER AVEC LA CLÉ EN DUR !
    
    SOLUTION RAPIDE DEV : Remplacez temporairement GOOGLE_MAPS_API_KEY_PLACEHOLDER ci-dessous
    par votre clé API, puis remettez le placeholder avant de commiter !
  -->
  <script>
    // Charger Google Maps API de manière asynchrone pour de meilleures performances
    (function() {
      const script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyCi6gk88a0y91dRMBpSxpuCHl24tt4fXFo&libraries=places&loading=async';
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    })();
  </script>
    <!-- Facebook SDK (pour login Web) -->
    <div id="fb-root"></div>
    <script>
      window.__fbReady = false;
      window.fbAsyncInit = function () {
        FB.init({
          appId: "758395477286479",
          cookie: true,
          xfbml: false,
          version: "v19.0"
        });
        window.__fbReady = true;
        console.log("[FB SDK] ready");
        console.log("[FB SDK] initialized:", typeof FB);
      };
  
      (function (d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s);
        js.id = id;
        js.src = "https://connect.facebook.net/en_US/sdk.js";
        js.async = true;
        js.defer = true;
        fjs.parentNode.insertBefore(js, fjs);
      })(document, "script", "facebook-jssdk");
    </script>
</body>
</html>
